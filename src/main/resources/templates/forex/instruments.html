<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{shared/layout}"
        lang="en"
><main layout:fragment="content">
    <h2>Look after the actual price:</h2>
    <form id="instrumentPickerForm" method="post" th:object="${chosenInstrument}">
        <div>
            <label>Choose an instrument:</label> <br>
            <select th:field="*{name}">
                <option th:each="inst : ${availableInstruments}" th:value="${inst}" th:text="${inst}"></option>
            </select>
        </div>
    </form>
    <button type="submit" form="instrumentPickerForm" th:formaction="@{/forex/actprice}">ActualPrice</button>
</main></html>
