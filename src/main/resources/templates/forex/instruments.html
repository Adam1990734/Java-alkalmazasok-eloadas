<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{shared/layout}"
        lang="en"
><main layout:fragment="content">
    <h2>Look after the actual price:</h2>
    <form id="instrumentPickerFormForSearch" method="post" th:object="${chosenInstrument}">
        <div>
            <label>Choose an instrument:</label> <br>
            <select th:field="*{name}">
                <option th:each="inst : ${availableInstruments}" th:value="${inst}" th:text="${inst}"></option>
            </select>
        </div>
        <div>
            <label>Choose granularity (if relevant):</label> <br>
            <select th:field="*{granularity}">
                <option th:each="gran : ${availableGranularities}" th:value="${gran}" th:text="${gran}"></option>
            </select>
        </div>
    </form>
    <!-- Instrumentum lekérdezés: -->
    <button type="submit" form="instrumentPickerFormForSearch" th:formaction="@{/forex/actprice}">ActualPrice</button>
    <button type="submit" form="instrumentPickerFormForSearch" th:formaction="@{/forex/histprice}">HistoricalPrice</button>
    <!-- Instrumentum műveletek: -->
    <form method="post" th:action="@{/forex/openpos}" th:object="${chosenInstrumentToOpen}">
        <div>
            <label>Choose an instrument:</label> <br>
            <select th:field="*{name}">
                <option th:each="inst : ${availableInstruments}" th:value="${inst}" th:text="${inst}"></option>
            </select>
        </div>
        <div>
            <label>Units :</label> <br>
            <input type="number" step="0.1" th:field="*{unit}">
        </div>
        <button type="submit">Open</button>
    </form>
    <form method="post" th:action="@{/forex/closepos}" th:object="${chosenTradeIdToClose}">
        <div>
            <label>Trade id: </label> <br>
            <input type="number" th:field="*{id}">
        </div>
        <button type="submit">Close</button>
    </form>
</main></html>
